<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JCSuite</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="JCSuite">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e1e1c" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.33.0/dist/tabler-icons.min.css">
  <style>
    :root {
      --color-background-primary: #ffffff;
      --color-background-secondary: #f4f4f2;
      --color-background-tertiary: #ebebeb;
      --color-background-info: #e6f1fb;
      --color-background-warning: #faeeda;
      --color-background-danger: #fcebeb;
      --color-background-success: #eaf3de;
      --color-text-primary: #1c1c1a;
      --color-text-secondary: #666660;
      --color-text-info: #185fa5;
      --color-text-warning: #854f0b;
      --color-text-danger: #a32d2d;
      --color-text-success: #3b6d11;
      --color-border-tertiary: rgba(28,28,26,0.12);
      --color-border-secondary: rgba(28,28,26,0.22);
      --color-border-primary: rgba(28,28,26,0.38);
      --color-border-info: rgba(24,95,165,0.3);
      --color-border-warning: rgba(133,79,11,0.3);
      --color-border-danger: rgba(163,45,45,0.3);
      --color-border-success: rgba(59,109,17,0.3);
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --font-serif: Georgia, serif;
      --font-mono: 'SF Mono', 'Fira Code', monospace;
      --border-radius-md: 8px;
      --border-radius-lg: 12px;
      --border-radius-xl: 16px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-background-primary: #1e1e1c;
        --color-background-secondary: #272725;
        --color-background-tertiary: #141412;
        --color-background-info: #0a1e35;
        --color-background-warning: #2a1c06;
        --color-background-danger: #2a0f0f;
        --color-background-success: #0f1e06;
        --color-text-primary: #f0ede8;
        --color-text-secondary: #8a8a85;
        --color-text-info: #85b7eb;
        --color-text-warning: #fac775;
        --color-text-danger: #f09595;
        --color-text-success: #c0dd97;
        --color-border-tertiary: rgba(240,237,232,0.12);
        --color-border-secondary: rgba(240,237,232,0.22);
        --color-border-primary: rgba(240,237,232,0.38);
        --color-border-info: rgba(133,183,235,0.3);
        --color-border-warning: rgba(250,199,117,0.3);
        --color-border-danger: rgba(240,149,149,0.3);
        --color-border-success: rgba(192,221,151,0.3);
      }
    }
    html, body { margin: 0; padding: 0; background: var(--color-background-tertiary); color: var(--color-text-primary); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    #app { display: flex; min-height: 100vh; font-family: var(--font-sans); background: var(--color-background-tertiary); }
    #sidebar { width: 200px; background: var(--color-background-primary); border-right: 0.5px solid var(--color-border-tertiary); display: flex; flex-direction: column; padding: 1rem 0; flex-shrink: 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
    .sidebar-logo { padding: 0 1rem 1rem; border-bottom: 0.5px solid var(--color-border-tertiary); margin-bottom: 0.75rem; }
    .sidebar-logo span { font-size: 17px; font-weight: 500; color: var(--color-text-primary); letter-spacing: -0.3px; }
    .sidebar-logo em { font-style: normal; color: var(--color-text-secondary); font-weight: 400; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 1rem; cursor: pointer; font-size: 14px; color: var(--color-text-secondary); transition: background 0.1s; border-left: 2px solid transparent; }
    .nav-item:hover { background: var(--color-background-secondary); color: var(--color-text-primary); }
    .nav-item.active { background: var(--color-background-secondary); color: var(--color-text-primary); border-left: 2px solid var(--color-text-primary); font-weight: 500; }
    .nav-item i { font-size: 17px; flex-shrink: 0; }
    .nav-label { font-size: 13px; }
    #main { flex: 1; padding: 1.5rem; overflow-y: auto; background: var(--color-background-tertiary); min-width: 0; max-width: 720px; }
    .widget-title { font-size: 18px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 1.5rem; }
    .card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .section-label { font-size: 12px; font-weight: 500; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.75rem; }
    .base-input { border: 0.5px solid var(--color-border-tertiary); background: var(--color-background-primary); color: var(--color-text-primary); border-radius: var(--border-radius-md); padding: 6px 10px; font-size: 13px; outline: none; font-family: var(--font-sans); }
    .base-input:focus { border-color: var(--color-border-primary); }
    select.base-input { cursor: pointer; }
    textarea.base-input { resize: vertical; }
    .icon-btn { background: none; border: none; cursor: pointer; color: var(--color-text-secondary); padding: 4px; border-radius: var(--border-radius-md); display: flex; align-items: center; justify-content: center; }
    .icon-btn:hover { color: var(--color-text-primary); background: var(--color-background-secondary); }
    .add-btn { font-size: 13px; color: var(--color-text-secondary); background: none; border: 0.5px dashed var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 6px 12px; cursor: pointer; width: 100%; text-align: left; margin-top: 4px; font-family: var(--font-sans); }
    .add-btn:hover { background: var(--color-background-secondary); color: var(--color-text-primary); }
    .calc-btn { width: 100%; padding: 10px; background: var(--color-text-primary); color: var(--color-background-primary); border: none; border-radius: var(--border-radius-md); font-size: 14px; font-weight: 500; cursor: pointer; font-family: var(--font-sans); }
    .calc-btn:hover { opacity: 0.85; }
    .save-btn { padding: 6px 16px; background: var(--color-text-primary); color: var(--color-background-primary); border: none; border-radius: var(--border-radius-md); font-size: 13px; font-weight: 500; cursor: pointer; font-family: var(--font-sans); }
    .save-btn:hover { opacity: 0.85; }
    .cancel-btn { padding: 6px 16px; background: none; color: var(--color-text-secondary); border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); font-size: 13px; cursor: pointer; font-family: var(--font-sans); }
    .cancel-btn:hover { background: var(--color-background-secondary); }
    .toggle-row { display: flex; gap: 4px; background: var(--color-background-secondary); border-radius: 999px; padding: 3px; width: fit-content; }
    .toggle-btn { font-size: 12px; padding: 4px 14px; border-radius: 999px; border: none; cursor: pointer; background: none; color: var(--color-text-secondary); font-family: var(--font-sans); transition: all 0.15s; }
    .toggle-btn.active { background: var(--color-background-primary); color: var(--color-text-primary); font-weight: 500; border: 0.5px solid var(--color-border-tertiary); }
    .tip-chip,.type-chip { font-size: 12px; padding: 4px 12px; border-radius: 999px; border: 0.5px solid var(--color-border-secondary); cursor: pointer; background: none; color: var(--color-text-secondary); transition: all 0.1s; font-family: var(--font-sans); }
    .tip-chip.selected,.type-chip.selected { background: var(--color-background-secondary); color: var(--color-text-primary); border-color: var(--color-border-primary); font-weight: 500; }
    .amt-wrapper { position: relative; }
    .amt-prefix { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--color-text-secondary); pointer-events: none; }
    .amt-input { padding-left: 20px !important; }
    .results-table,.rb-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .results-table th,.rb-table th { text-align: left; font-weight: 500; font-size: 12px; color: var(--color-text-secondary); padding: 5px 8px 8px 0; border-bottom: 0.5px solid var(--color-border-tertiary); }
    .results-table td,.rb-table td { padding: 7px 8px 7px 0; border-bottom: 0.5px solid var(--color-border-tertiary); color: var(--color-text-primary); }
    .results-table tr:last-child td,.rb-table tr:last-child td { border-bottom: none; }
    .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--color-background-secondary); color: var(--color-text-secondary); white-space: nowrap; }
    .badge-warn { background: var(--color-background-warning); color: var(--color-text-warning); }
    .badge-danger { background: var(--color-background-danger); color: var(--color-text-danger); }
    .badge-info { background: var(--color-background-info); color: var(--color-text-info); }
    .badge-success { background: var(--color-background-success); color: var(--color-text-success); }
    .pp-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
    .pp-metrics,.rb-metrics { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 1.25rem; }
    .metric { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 0.75rem 1rem; }
    .metric-label { font-size: 11px; color: var(--color-text-secondary); font-weight: 500; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; }
    .metric-value { font-size: 20px; font-weight: 500; color: var(--color-text-primary); }
    .pp-benefit { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 0.875rem 1rem; margin-bottom: 8px; }
    .pp-benefit.expiring { border-color: var(--color-border-warning); }
    .progress-track { height: 3px; background: var(--color-background-secondary); border-radius: 999px; margin-top: 6px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 999px; background: var(--color-text-secondary); }
    .color-opt { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
    .color-opt.selected { outline: 2px solid var(--color-border-secondary); outline-offset: 1px; }
    .form-label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 4px; display: block; }
    .coming-soon { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3rem 1rem; color: var(--color-text-secondary); gap: 0.75rem; }
    .coming-soon i { font-size: 32px; }
    .coming-soon p { font-size: 14px; }
    .pk-trip-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem 1.25rem; margin-bottom: 10px; cursor: pointer; transition: border-color 0.1s; }
    .pk-trip-card:hover { border-color: var(--color-border-secondary); }
    .pk-prog-track { height: 4px; background: var(--color-background-secondary); border-radius: 999px; overflow: hidden; }
    .pk-prog-fill { height: 100%; border-radius: 999px; background: var(--color-text-secondary); }
    .pk-cat-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; cursor: pointer; user-select: none; }
    .pk-cat-label { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); display: flex; align-items: center; gap: 6px; }
    .pk-item { display: flex; align-items: center; gap: 8px; padding: 6px 0 4px; }
    .pk-item input[type=checkbox] { flex-shrink: 0; cursor: pointer; width: 15px; height: 15px; }
    .pk-item-name { flex: 1; font-size: 13px; color: var(--color-text-primary); }
    .pk-item-name.packed { text-decoration: line-through; color: var(--color-text-secondary); }
    .pk-qty-badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--color-background-secondary); color: var(--color-text-secondary); flex-shrink: 0; cursor: pointer; border: none; font-family: var(--font-sans); }
    .pk-qty-badge:hover { background: var(--color-background-tertiary); color: var(--color-text-primary); }
    .pk-note-text { font-size: 12px; color: var(--color-text-secondary); padding: 0 0 6px 23px; font-style: italic; cursor: pointer; }
    .rb-tab-btn { padding: 8px 16px; font-size: 13px; background: none; border: none; cursor: pointer; border-bottom: 2px solid transparent; font-family: var(--font-sans); color: var(--color-text-secondary); margin-bottom: -0.5px; transition: all 0.1s; }
    .rb-tab-btn.active { border-bottom-color: var(--color-text-primary); color: var(--color-text-primary); font-weight: 500; }
    .rb-tab-btn:hover { color: var(--color-text-primary); }
    @media (max-width: 600px) {
      #sidebar { width: 52px; }
      .nav-label { display: none; }
      .sidebar-logo { padding: 0 0 1rem; display: flex; justify-content: center; }
      .sidebar-logo span { display: none; }
      .nav-item { justify-content: center; padding: 10px 0; }
      #main { padding: 1rem; }
      .pp-metrics, .rb-metrics { grid-template-columns: repeat(3,1fr); }
    }
  </style>
</head>
<body>
<div id="app">
  <nav id="sidebar">
    <div class="sidebar-logo"><span>JC<em>Suite</em></span></div>
    <div class="nav-item active" onclick="showWidget('tabsplit')"><i class="ti ti-receipt-2" aria-hidden="true"></i><span class="nav-label">TabSplit</span></div>
    <div class="nav-item" onclick="showWidget('perkpulse')"><i class="ti ti-credit-card" aria-hidden="true"></i><span class="nav-label">PerkPulse</span></div>
    <div class="nav-item" onclick="showWidget('packpal')"><i class="ti ti-luggage" aria-hidden="true"></i><span class="nav-label">PackPal</span></div>
    <div class="nav-item" onclick="showWidget('giftvault')"><i class="ti ti-gift" aria-hidden="true"></i><span class="nav-label">GiftVault</span></div>
    <div class="nav-item" onclick="showWidget('repbook')"><i class="ti ti-barbell" aria-hidden="true"></i><span class="nav-label">RepBook</span></div>
  </nav>
  <main id="main">
    <div id="view-tabsplit">
      <p class="widget-title">TabSplit</p>
      <div class="card"><p class="section-label">People</p><div id="people-list"></div><button class="add-btn" onclick="addPerson()"><i class="ti ti-plus" style="font-size:13px;margin-right:4px;"></i>Add person</button></div>
      <div class="card">
        <p class="section-label">Bill details</p>
        <div style="margin-bottom:12px;"><div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:4px;">Tax ($)</div><div class="amt-wrapper" style="width:140px;"><span class="amt-prefix">$</span><input id="tax" type="number" placeholder="0.00" min="0" step="0.01" class="base-input amt-input" style="width:140px;" onblur="fmtField(this)" onfocus="clearFmt(this)"></div></div>
        <div class="section-label">Tip</div>
        <div class="toggle-row" style="margin-bottom:10px;"><button class="toggle-btn active" id="tip-mode-pct" onclick="setTipMode('pct')">%</button><button class="toggle-btn" id="tip-mode-dollar" onclick="setTipMode('dollar')">$</button></div>
        <div id="tip-pct-section"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;"><button class="tip-chip" onclick="selectTipChip(this,18)">18%</button><button class="tip-chip selected" onclick="selectTipChip(this,20)">20%</button><button class="tip-chip" onclick="selectTipChip(this,22)">22%</button><button class="tip-chip" onclick="selectTipChip(this,25)">25%</button><button class="tip-chip" id="custom-chip" onclick="selectTipChip(this,-1)">Custom</button></div><div id="custom-tip-row" style="display:none;align-items:center;gap:8px;"><input type="number" id="custom-tip-val" placeholder="%" min="0" max="100" class="base-input" style="width:80px;" oninput="tipPct=parseFloat(this.value)||0"><span style="font-size:13px;color:var(--color-text-secondary);">%</span></div></div>
        <div id="tip-dollar-section" style="display:none;"><div class="amt-wrapper" style="width:140px;"><span class="amt-prefix">$</span><input id="tip-dollar-val" type="number" placeholder="0.00" min="0" step="0.01" class="base-input amt-input" style="width:140px;" onblur="fmtField(this)" onfocus="clearFmt(this)"></div></div>
      </div>
      <button class="calc-btn" onclick="calculate()">Calculate split</button>
      <div class="card" id="results-card" style="display:none;margin-top:1rem;"><p class="section-label">Results</p><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1rem;" id="metrics-row"></div><table class="results-table"><thead><tr><th>Person</th><th>Food</th><th>+Tax+Tip</th><th style="text-align:right;">Owes you</th></tr></thead><tbody id="results-body"></tbody></table></div>
    </div>
    <div id="view-perkpulse" style="display:none;">
      <div class="pp-header"><p class="widget-title" style="margin-bottom:0;">PerkPulse</p><div class="toggle-row"><button class="toggle-btn active" id="pp-tab-ov" onclick="setPPView('overview')">Overview</button><button class="toggle-btn" id="pp-tab-cards" onclick="setPPView('cards')">My cards</button></div></div>
      <div id="pp-content"></div>
    </div>
    <div id="view-packpal" style="display:none;"><div id="pk-content"></div></div>
    <div id="view-giftvault" style="display:none;"><div id="gv-content"></div></div>
    <div id="view-repbook" style="display:none;"><div id="rb-content"></div></div>
  </main>
</div>
<script>
// ── SHARED ──
function showWidget(n){['tabsplit','perkpulse','packpal','giftvault','repbook'].forEach(w=>document.getElementById('view-'+w).style.display=w===n?'':'none');const L={tabsplit:'TabSplit',perkpulse:'PerkPulse',packpal:'PackPal',giftvault:'GiftVault',repbook:'RepBook'};document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.querySelector('.nav-label').textContent===L[n]));if(n==='perkpulse')renderPP();if(n==='packpal')renderPK();if(n==='giftvault')renderGV();if(n==='repbook')renderRB();}
function fmtDate(d){const dt=new Date(d+'T00:00:00');return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});}

// ── TABSPLIT ──
let tipPct=20,tipMode='pct',people=[],pidCounter=0;
function fmtField(el){const v=parseFloat(el.value);if(!isNaN(v))el.value=v.toFixed(2);}
function clearFmt(el){if(el.value==='0.00')el.value='';}
function setTipMode(m){tipMode=m;document.getElementById('tip-mode-pct').classList.toggle('active',m==='pct');document.getElementById('tip-mode-dollar').classList.toggle('active',m==='dollar');document.getElementById('tip-pct-section').style.display=m==='pct'?'':'none';document.getElementById('tip-dollar-section').style.display=m==='dollar'?'':'none';}
function selectTipChip(el,pct){document.querySelectorAll('.tip-chip').forEach(c=>c.classList.remove('selected'));el.classList.add('selected');const cr=document.getElementById('custom-tip-row');if(pct===-1){cr.style.display='flex';tipPct=parseFloat(document.getElementById('custom-tip-val').value)||0;}else{cr.style.display='none';tipPct=pct;}}
function addPerson(){const id=++pidCounter;people.push({id,name:'',items:[{desc:'',amt:''}]});renderPeople();}
function removePerson(id){people=people.filter(p=>p.id!==id);renderPeople();}
function addItem(pid,ff){const p=people.find(p=>p.id===pid);if(p){p.items.push({desc:'',amt:''});renderPeople();if(ff){setTimeout(()=>{const c=document.querySelector('[data-pid="'+pid+'"]');if(c){const els=c.querySelectorAll('.item-'+ff);if(els.length)els[els.length-1].focus();}},20);}}}
function removeItem(pid,idx){const p=people.find(p=>p.id===pid);if(p&&p.items.length>1){p.items.splice(idx,1);renderPeople();}}
function updateName(pid,val){const p=people.find(p=>p.id===pid);if(p)p.name=val;}
function updateItemDesc(pid,idx,val){const p=people.find(p=>p.id===pid);if(p)p.items[idx].desc=val;}
function updateItemAmt(pid,idx,val){const p=people.find(p=>p.id===pid);if(p)p.items[idx].amt=val;}
function fmtItemAmt(el,pid,idx){const v=parseFloat(el.value);if(!isNaN(v)&&v>0){el.value=v.toFixed(2);updateItemAmt(pid,idx,el.value);}}
function handleAmtKeydown(e,pid,idx){if(e.key==='Tab'&&!e.shiftKey){const p=people.find(p=>p.id===pid);if(p&&idx===p.items.length-1){e.preventDefault();fmtItemAmt(e.target,pid,idx);addItem(pid,'desc');}}}
function renderPeople(){document.getElementById('people-list').innerHTML=people.map(p=>`<div data-pid="${p.id}" style="margin-bottom:12px;padding-bottom:12px;border-bottom:0.5px solid var(--color-border-tertiary);"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;"><input type="text" placeholder="Name" value="${p.name}" onchange="updateName(${p.id},this.value)" style="border:none;background:none;font-size:13px;font-weight:500;color:var(--color-text-primary);outline:none;width:140px;padding:0;font-family:var(--font-sans);"><button class="icon-btn" onclick="removePerson(${p.id})"><i class="ti ti-x" style="font-size:14px;"></i></button></div><div style="display:flex;gap:8px;font-size:11px;color:var(--color-text-secondary);font-weight:500;padding-bottom:4px;"><span style="flex:1.4;">Item <span style="font-weight:400;opacity:0.6;">(optional)</span></span><span style="flex:1;">Amount</span><span style="width:26px;"></span></div>${p.items.map((it,idx)=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;"><input type="text" placeholder="—" value="${it.desc}" onchange="updateItemDesc(${p.id},${idx},this.value)" class="base-input item-desc" style="flex:1.4;"><div class="amt-wrapper" style="flex:1;"><span class="amt-prefix">$</span><input type="number" placeholder="0.00" value="${it.amt}" min="0" step="0.01" class="base-input amt-input item-amt" oninput="updateItemAmt(${p.id},${idx},this.value)" onblur="fmtItemAmt(this,${p.id},${idx})" onfocus="if(this.value==='0.00')this.value=''" onkeydown="handleAmtKeydown(event,${p.id},${idx})"></div><button class="icon-btn" onclick="removeItem(${p.id},${idx})"><i class="ti ti-x" style="font-size:13px;"></i></button></div>`).join('')}<button class="add-btn" onclick="addItem(${p.id},false)"><i class="ti ti-plus" style="font-size:12px;margin-right:4px;"></i>Add item</button></div>`).join('');}

function daysUntilReset(b){const now=new Date();now.setHours(0,0,0,0);if(b.cadence==='monthly'){const e=new Date(now.getFullYear(),now.getMonth()+1,0);return Math.ceil((e-now)/86400000);}if(b.cadence==='calendar_year'){const e=new Date(now.getFullYear(),11,31);return Math.ceil((e-now)/86400000);}if(b.cadence==='anniversary'&&b.anniversaryDate){let a=new Date(b.anniversaryDate);a.setHours(0,0,0,0);if(a<=now)a.setFullYear(now.getFullYear()+1);return Math.ceil((a-now)/86400000);}return null;}
function isExpiringSoon(b){const d=daysUntilReset(b);if(d===null)return false;return b.cadence==='monthly'?d<=7:d<=30;}
function isUnused(b){if(b.type==='lounge'||b.type==='subscription')return !b.used;return(b.usedAmount||0)<b.value;}
function valueRemaining(b){if(b.type==='lounge'||b.type==='subscription')return null;return b.value-(b.usedAmount||0);}

function renderPPOverview(){const allUnused=[];ppCards.forEach(card=>card.benefits.forEach(b=>{if(isUnused(b))allUnused.push({b,card});}));const expiring=allUnused.filter(({b})=>isExpiringSoon(b));const other=allUnused.filter(({b})=>!isExpiringSoon(b));const totalVal=allUnused.reduce((s,{b})=>s+(valueRemaining(b)||0),0);let html=`<div class="pp-metrics"><div class="metric"><div class="metric-label">Unused value</div><div class="metric-value">$${Math.round(totalVal)}</div></div><div class="metric"><div class="metric-label">Act soon</div><div class="metric-value">${expiring.length}</div></div><div class="metric"><div class="metric-label">Unused benefits</div><div class="metric-value">${allUnused.length}</div></div></div>`;if(expiring.length){html+=`<p class="section-label" style="margin-bottom:8px;"><i class="ti ti-alert-triangle" style="font-size:12px;margin-right:4px;vertical-align:-1px;"></i>Act soon</p>`;html+=expiring.map(({b,card})=>benefitItemHTML(b,card,true)).join('');}if(other.length){html+=`<p class="section-label" style="margin-top:1rem;margin-bottom:8px;">Unused this period</p>`;html+=other.map(({b,card})=>benefitItemHTML(b,card,false)).join('');}if(!allUnused.length)html+=`<div class="coming-soon"><i class="ti ti-confetti"></i><p style="font-weight:500;color:var(--color-text-primary);">All caught up!</p></div>`;document.getElementById('pp-content').innerHTML=html;}

ay:flex;align-items:center;gap:8px;margin-top:4px;"><div style="flex:1;"><div class="pk-prog-track"><div class="pk-prog-fill" style="width:${pct}%;"></div></div></div><span style="font-size:12px;color:var(--color-text-secondary);">${packed}/${total} packed</span></div></div>`;});}document.getElementById('pk-content').innerHTML=html;}
function renderPKNew(){document.getElementById('pk-content').innerHTML=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:1.5rem;"><button class="icon-btn" onclick="pkView='list';renderPK()" style="border:0.5px solid var(--color-border-tertiary);"><i class="ti ti-arrow-left" style="font-size:15px;"></i></button><p class="widget-title" style="margin-bottom:0;">New trip</p></div><div class="card"><div style="margin-bottom:12px;"><label class="form-label">Trip name</label><input type="text" id="pk-name" class="base-input" style="width:100%;"></div><div style="margin-bottom:12px;"><label class="form-label">Destination</label><input type="text" id="pk-dest" class="base-input" style="width:100%;"></div><div style="display:flex;gap:8px;margin-bottom:12px;"><div style="flex:1;"><label class="form-label">Start date</label><input type="date" id="pk-start" class="base-input" style="width:100%;" onchange="pkCalcDays()"></div><div style="flex:1;"><label class="form-label">End date</label><input type="date" id="pk-end" class="base-input" style="width:100%;" onchange="pkCalcDays()"></div><div style="width:80px;"><label class="form-label">Days</label><input type="number" id="pk-days" min="1" class="base-input" style="width:100%;"></div></div><div style="margin-bottom:12px;"><label class="form-label">Trip type</label><div style="display:flex;gap:8px;margin-top:2px;"><button class="type-chip selected" id="tc-beach" onclick="selectPKType('beach')"><i class="ti ti-sun" style="font-size:13px;margin-right:4px;"></i>Beach</button><button class="type-chip" id="tc-city" onclick="selectPKType('city')"><i class="ti ti-building" style="font-size:13px;margin-right:4px;"></i>City</button><button class="type-chip" id="tc-international" onclick="selectPKType('international')"><i class="ti ti-world" style="font-size:13px;margin-right:4px;"></i>International</button></div></div><div style="margin-bottom:16px;"><label class="form-label">Notes <span style="font-weight:400;opacity:0.6; function selectPKType(t){pkSelectedType=t;['beach','city','international'].forEach(x=>document.getElementById('tc-'+x)?.classList.toggle('selected',x===t));}
function pkCalcDays(){const s=document.getElementById('pk-start')?.value,e=document.getElementById('pk-end')?.value;if(s&&e){const d=Math.ceil((new Date(e)-new Date(s))/86400000);if(d>0)document.getElementById('pk-days').value=d;}}
function createTrip(){const name=document.getElementById('pk-name')?.value?.trim();if(!name){alert('Please enter a trip name.');return;}const days=parseInt(document.getElementById('pk-days')?.value)||1;const trip={id:++pkNextId,name,destination:document.getElementById('pk-dest')?.value?.trim()||'',startDate:document.getElementById('pk-start')?.value||'',endDate:document.getElementById('pk-end')?.value||'',days,type:pkSelectedType,notes:document.getElementById('pk-notes')?.value?.trim()||'',items:buildPKItems(pkSelectedType,days)};pkTrips.push(trip);pkActiveTrip=trip.id;pkView='detail';pkCollapsedCats=new Set();pkEditingQty=null;renderPK();}
function deleteTrip(id){if(confirm('Delete this trip?')){pkTrips=pkTrips.filter(t=>t.id!==id);renderPKList();}}
function renderPKDetail(){const trip=pkTrips.find(t=>t.id===pkActiveTrip);if(!trip){pkView='list';renderPKList();return;}const total=trip.items.length,packed=trip.items.filter(i=>i.packed).length,pct=total?Math.round(packed/total*100):0;let html=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:1.25rem;"><button class="icon-btn" onclick="pkView='list';pkAddingCat=null;pkEditingQty=null;renderPK()" style="border:0.5px solid var(--color-border-tertiary);"><i class="ti ti-arrow-left" style="font-size:15px;"></i></button><div style="flex:1;min-width:0;"><div style="font-size:18px;font-weight:500;color:var(--color-text-primary);">${trip.name}</div><div style="font-size:12px;color:var(--color-text-secondary);">${trip.destination}${trip.destination&&trip.days?' · ':''}${trip.days} day${trip.days!==1?'s':''}</div></div><span style="font-size:12px;font-weight:500;color:var(--color-text-secondary);">${packed}/${total}</span></div><div style="margin-bottom:1.25rem;"><div class="pk-prog-track" style="height:6px;"><div class="pk-prog-fill" style="width:${pct}%;background:${pct===100?'var(--color-text-success)':'var(--color-text-secondary)'};"></div></div><div style="font-size:11px;color:var(--color-text-secondary);margin-top:4px;">${pct}% packed</div></div>`;Object.entries(pkCatMeta).forEach(([cat,meta])=>{const catItems=trip.items.filter(i=>i.category===cat),catPacked=catItems.filter(i=>i.packed).length,collapsed=pkCollapsedCats.has(cat);html+=`<div class="card" style="margin-bottom:8px;padding:0.75rem 1rem;"><div class="pk-cat-header" onclick="togglePKCat('${cat}')"><div class="pk-cat-label"><i class="ti ${meta.icon}" style="font-size:15px;"></i>${meta.label}<span class="badge">${catPacked}/${catItems.length}</span></div><i class="ti ${collapsed?'ti-chevron-down':'ti-chevron-up'}" style="font-size:14px;color:var(--color-text-secondary);"></i></div>${!collapsed?`<div style="padding-top:6px;border-top:0.5px solid var(--color-border-tertiary);">${catItems.map(it=>{const noteOpen=pkNotesOpen.has(it.id),hasNote=it.notes&&it.notes.trim(),qtyEdit=pkEditingQty===it.id;return `<div style="border-bottom:0.5px solid var(--color-border-tertiary);"><div class="pk-item" style="border-bottom:none;"><input type="checkbox" ${it.packed?'checked':''} onchange="togglePKItem(${trip.id},${it.id},this.checked)"><span class="pk-item-name${it.packed?' packed':''}">${it.name}</span>${qtyEdit?`<input type="number" id="pk-qty-${it.id}" value="${it.qty}" min="1" class="base-input" style="width:52px;font-size:12px;padding:3px 6px;flex-shrink:0;" onblur="savePKQty(${trip.id},${it.id},this.value)" onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){pkEditingQty=null;renderPKDetail();}">`:`<button class="pk-qty-badge" onclick="pkEditingQty=${it.id};renderPKDetail()">×${it.qty}</button>`}<button class="icon-btn" onclick="togglePKNotes(${it.id})" style="color:${hasNote?'var(--color-text-primary)':'var(--color-text-secondary)'};"><i class="ti ti-note" style="font-size:14px;"></i></button><button class="icon-btn" onclick="removePKItem(${trip.id},${it.id})"><i class="ti ti-x" style="font-size:12px;"></i></button></div>${noteOpen?`<div style="padding:0 0 8px 23px;"><input type="text" value="${(it.notes||'').replace(/"/g,'&quot;')}" placeholder="e.g. black Reefs..." class="base-input" style="width:100%;font-size:12px;" oninput="updatePKNote(${trip.id},${it.id},this.value)" onkeydown="if(event.key==='Enter'||event.key==='Escape')togglePKNotes(${it.id})"></div>`:hasNote?`<div class="pk-note-text" onclick="togglePKNotes(${it.id})">${it.notes}</div>`:''}</div>`;}).join('')}${pkAddingCat===cat?`<div style="display:flex;gap:6px;align-items:center;padding:6px 0;"><input type="text" id="pk-new-name" placeholder="Item name" class="base-input" style="flex:1;" onkeydown="if(event.key==='Enter')savePKItem('${cat}')"><input type="number" id="pk-new-qty" value="1" min="1" class="base-input" style="width:58px;"><button class="save-btn" style="padding:5px 12px;font-size:12px;" onclick="savePKItem('${cat}')">Add</button><button class="cancel-btn" style="padding:5px 10px;font-size:12px;" onclick="pkAddingCat=null;renderPKDetail()">✕</button></div>`:`<button class="add-btn" onclick="pkAddingCat='${cat}';renderPKDetail()" style="margin-top:4px;font-size:12px;padding:5px 10px;"><i class="ti ti-plus" style="font-size:11px;margin-right:3px;"></i>Add item</button>`}</div>`:''}</div>`;});if(trip.notes)html+=`<div class="card" style="margin-top:4px;"><div class="section-label">Notes</div><div style="font-size:13px;">${trip.notes}</div></div>`;document.getElementById('pk-content').innerHTML=html;if(pkEditingQty){setTimeout(()=>{const el=document.getElementById('pk-qty-'+pkEditingQty);if(el){el.focus();el.select();}},20);}if(pkAddingCat)setTimeout(()=>document.getElementById('pk-new-name')?.focus(),20);}
function togglePKCat(cat){if(pkCollapsedCats.has(cat))pkCollapsedCats.delete(cat);else pkCollapsedCats.add(cat);renderPKDetail();}
function togglePKItem(tid,iid,checked){const t=pkTrips.find(t=>t.id===tid);const i=t?.items.find(i=>i.id===iid);if(i){i.packed=checked;renderPKDetail();}}
function removePKItem(tid,iid){const t=pkTrips.find(t=>t.id===tid);if(t){t.items=t.items.filter(i=>i.id!==iid);renderPKDetail();}}
function savePKItem(cat){const name=document.getElementById('pk-new-name')?.value?.trim();const qty=parseInt(document.getElementById('pk-new-qty')?.value)||1;if(!name)return;const trip=pkTrips.find(t=>t.id===pkActiveTrip);if(trip){trip.items.push({id:++pkNextId,category:cat,name,qty,scales:false,packed:false,notes:''});pkAddingCat=null;renderPKDetail();}}

let gvPeople=[],gvNextId=200,gvView='list',gvActivePerson=null,gvAddingGift=false,gvAddingOccasion=false;

function daysUntilDate(d){if(!d)return null;const now=new Date();now.setHours(0,0,0,0);return Math.ceil((new Date(d+'T00:00:00')-now)/86400000);}
function daysUntilBirthday(d){if(!d)return null;const now=new Date();now.setHours(0,0,0,0);const bd=new Date(d);let next=new Date(now.getFullYear(),bd.getMonth(),bd.getDate());if(next<now)next.setFullYear(now.getFullYear()+1);return Math.ceil((next-now)/86400000);}
function fmtBirthday(d){const dt=new Date(d+'T00:00:00');return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function getUpcoming(person){const out=[];if(person.birthday){const d=daysUntilBirthday(person.birthday);if(d!==null&&d<=30)out.push({name:'Birthday',days:d});}person.occasions.forEach(o=>{const d=daysUntilDate(o.date);if(d!==null&&d>=0&&d<=30)out.push({name:o.name,days:d});});return out;}
function renderGV(){if(gvView==='list')renderGVList();else if(gvView==='new')renderGVNew();else renderGVPerson();}
function renderGVList(){const allUpcoming=[];gvPeople.forEach(p=>getUpcoming(p).forEach(u=>allUpcoming.push({person:p,...u})));allUpcoming.sort((a,b)=>a.days-b.days);let html=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;"><p class="widget-title" style="margin-bottom:0;">GiftVault</p><button class="save-btn" onclick="gvView='new';renderGV()"><i class="ti ti-plus" style="font-size:13px;margin-right:4px;"></i>Add person</button></div>`;if(allUpcoming.length){html+=`<div style="background:var(--color-background-warning);border-radius:var(--border-radius-lg);padding:0.875rem 1rem;margin-bottom:1rem;border:0.5px solid var(--color-border-warning);"><div style="font-size:12px;font-weight:500;color:var(--color-text-warning);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;"><i class="ti ti-bell" style="font-size:12px;margin-right:4px;"></i>Coming up</div>`;allUpcoming.forEach(u=>{const lbl=u.days===0?'today':u.days===1?'tomorrow':`in ${u.days} days`;html+=`<div style="font-size:13px;color:var(--color-text-warning);margin-bottom:2px;cursor:pointer;" onclick="gvActivePerson=${u.person.id};gvView='person';renderGV()"><span style="font-weight:500;">${u.person.name}</span>'s ${u.name} — ${lbl}</div>`;});html+=`</div>`;}if(!gvPeople.length){html+=`<div class="coming-soon"><i class="ti ti-gift"></i><p style="font-weight:500;color:var(--color-text-primary);">No people yet</p><p>Add someone to start tracking gift ideas.</p></div>`;}else{gvPeople.forEach(p=>{const upcoming=getUpcoming(p);const gc={idea:p.gifts.filter(g=>g.status==='idea').length,bought:p.gifts.filter(g=>g.status==='bought').length,given:p.gifts.filter(g=>g.status==='given').length};html+=`<div class="pk-trip-card" onclick="gvActivePerson=${p.id};gvView='person';gvAddingGift=false;gvAddingOccasion=false;renderGV()"><div style="display:flex;align-items:flex-start;justify-content:space-between;"><div style="flex:1;min-width:0;"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;"><span style="font-size:14px;font-weight:500;color:var(--color-text-primary);">${p.name}</span><span class="badge">${p.relationship}</span>${upcoming.length?`<span class="badge badge-warn">🎂 ${upcoming[0].days===0?'today':upcoming[0].days+'d'}</span>`:''}</div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">${p.birthday?`<span style="font-size:12px;color:var(--color-text-secondary);">Birthday ${fmtBirthday(p.birthday)}</span>`:''}${p.gifts.length?`<span style="font-size:12px;color:var(--color-text-secondary);">${p.gifts.length} idea${p.gifts.length!==1?'s':''}</span>`:'<span style="font-size:12px;color:var(--color-text-secondary);">No ideas yet</span>'}${gc.bought?`<span class="badge badge-info">${gc.bought} bought</span>`:''}${gc.given?`<span class="badge badge-success">${gc.given} given</span>`:''}</div></div><button class="icon-btn" onclick="event.stopPropagation();deleteGVPerson(${p.id})"><i class="ti ti-trash" style="font-size:14px;"></i></button></div></div>`;});}document.getElementById('gv-content').innerHTML=html;}

function renderGVPerson(){const p=gvPeople.find(p=>p.id===gvActivePerson);if(!p){gvView='list';renderGVList();return;}let html=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:1.5rem;"><button class="icon-btn" onclick="gvView='list';renderGV()" style="border:0.5px solid var(--color-border-tertiary);"><i class="ti ti-arrow-left" style="font-size:15px;"></i></button><div><div style="font-size:18px;font-weight:500;color:var(--color-text-primary);">${p.name}</div><div style="font-size:12px;color:var(--color-text-secondary);">${p.relationship}</div></div></div>`;html+=`<div class="card"><p class="section-label">Occasions</p>`;if(p.birthday){const d=daysUntilBirthday(p.birthday);const cls=d<=7?'badge-danger':d<=30?'badge-warn':'badge';html+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:0.5px solid var(--color-border-tertiary);"><div style="display:flex;align-items:center;gap:8px;"><i class="ti ti-cake" style="font-size:15px;color:var(--color-text-secondary);"></i><span style="font-size:13px;">Birthday — ${fmtBirthday(p.birthday)}</span></div><span class="badge ${cls}">${d===0?'today':d===1?'tomorrow':d+' days'}</span></div>`;}p.occasions.forEach(o=>{const d=daysUntilDate(o.date);const cls=d!==null&&d<=7?'badge-danger':d!==null&&d<=30?'badge-warn':'badge';const lbl=d===null?'':d<0?'passed':d===0?'today':d===1?'tomorrow':d+' days';html+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:0.5px solid var(--color-border-tertiary);"><div style="display:flex;align-items:center;gap:8px;"><i class="ti ti-calendar-event" style="font-size:15px;color:var(--color-text-secondary);"></i><span style="font-size:13px;">${o.name} — ${fmtDate(o.date)}</span></div><div style="display:flex;align-items:center;gap:6px;">${lbl?`<span class="badge ${cls}">${lbl}</span>`:''}<button class="icon-btn" onclick="deleteGVOccasion(${p.id},${o.id})"><i class="ti ti-x" style="font-size:12px;"></i></button></div></div>`;});html+=gvAddingOccasion?`<div style="display:flex;gap:8px;align-items:center;padding:8px 0;"><input type="text" id="gv-occ-name" placeholder="Occasion name" class="base-input" style="flex:1;"><input type="date" id="gv-occ-date" class="base-input" style="width:150px;"><button class="save-btn" style="padding:5px 12px;font-size:12px;" onclick="saveGVOccasion(${p.id})">Add</button><button class="cancel-btn" style="padding:5px 10px;font-size:12px;" onclick="gvAddingOccasion=false;renderGVPerson()">✕</button></div>`:`<button class="add-btn" onclick="gvAddingOccasion=true;renderGVPerson()" style="margin-top:4px;"><i class="ti ti-plus" style="font-size:12px;margin-right:4px;"></i>Add occasion</button>`;html+=`</div><div class="card"><p class="section-label">Gift ideas</p>`;if(!p.gifts.length&&!gvAddingGift)html+=`<div style="text-align:center;padding:1rem;font-size:13px;color:var(--color-text-secondary);">No gift ideas yet</div>`;p.gifts.forEach(g=>{html+=`<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--color-border-tertiary);"><div style="flex:1;min-width:0;"><div style="font-size:13px;margin-bottom:2px;">${g.idea}</div><div style="display:flex;align-items:center;gap:8px;">${g.price?`<span style="font-size:12px;color:var(--color-text-secondary);">$${g.price}</span>`:''}${g.link?`<a href="${g.link}" target="_blank" style="font-size:12px;color:var(--color-text-info);display:flex;align-items:center;gap:2px;"><i class="ti ti-external-link" style="font-size:12px;"></i>Link</a>`:''}</div></div><button class="badge ${gvStatusClasses[g.status]}" onclick="cycleGVStatus(${p.id},${g.id})" style="cursor:pointer;border:none;font-family:var(--font-sans);">${gvStatusLabels[g.status]}</button><button class="icon-btn" onclick="deleteGVGift(${p.id},${g.id})"><i class="ti ti-x" style="font-size:12px;"></i></button></div>`;});html+=gvAddingGift?`<div style="padding:10px 0;"><div style="display:flex;gap:8px;margin-bottom:8px;"><input type="text" id="gv-gift-idea" placeholder="Gift idea" class="base-input" style="flex:1;"><div class="amt-wrapper" style="width:90px;"><span class="amt-prefix">$</span><input type="number" id="gv-gift-price" placeholder="0" min="0" class="base-input amt-input" style="width:90px;"></div></div><div style="margin-bottom:10px;"><input type="text" id="gv-gift-link" placeholder="Link (optional)" class="base-input" style="width:100%;"></div><div style="display:flex;gap:8px;"><button class="save-btn" style="padding:5px 14px;font-size:12px;" onclick="saveGVGift(${p.id})">Add idea</button><button class="cancel-btn" style="padding:5px 10px;font-size:12px;" onclick="gvAddingGift=false;renderGVPerson()">Cancel</button></div></div>`:`<button class="add-btn" onclick="gvAddingGift=true;renderGVPerson()" style="margin-top:4px;"><i class="ti ti-plus" style="font-size:12px;margin-right:4px;"></i>Add gift idea</button>`;html+=`</div>`;document.getElementById('gv-content').innerHTML=html;if(gvAddingGift)setTimeout(()=>document.getElementById('gv-gift-idea')?.focus(),20);if(gvAddingOccasion)setTimeout(()=>document.getElementById('gv-occ-name')?.focus(),20);}
function saveGVGift(pid){const p=gvPeople.find(p=>p.id===pid);if(!p)return;const idea=document.getElementById('gv-gift-idea')?.value?.trim();if(!idea){alert('Please enter a gift idea.');return;}p.gifts.push({id:++gvNextId,idea,price:parseFloat(document.getElementById('gv-gift-price')?.value)||null,link:document.getElementById('gv-gift-link')?.value?.trim()||'',status:'idea'});gvAddingGift=false;renderGVPerson();}
function cycleGVStatus(pid,gid){const p=gvPeople.find(p=>p.id===pid);const g=p?.gifts.find(g=>g.id===gid);if(g){g.status=gvStatusNext[g.status];renderGVPerson();}}
function deleteGVGift(pid,gid){const p=gvPeople.find(p=>p.id===pid);if(p){p.gifts=p.gifts.filter(g=>g.id!==gid);renderGVPerson();}}
function saveGVOccasion(pid){const p=gvPeople.find(p=>p.id===pid);if(!p)return;const name=document.getElementById('gv-occ-name')?.value?.trim();if(!name){alert('Please enter an occasion name.');return;}p.occasions.push({id:++gvNextId,name,date:document.getElementById('gv-occ-date')?.value||''});gvAddingOccasion=false;renderGVPerson();}
function deleteGVOccasion(pid,oid){const p=gvPeople.find(p=>p.id===pid);if(p){p.occasions=p.occasions.filter(o=>o.id!==oid);renderGVPerson();}}
renderGV();

// ── REPBOOK ──
let rbTemplates=[{id:1,name:'Push day',type:'lifting',exercises:[{id:1,name:'Bench press'},{id:2,name:'Overhead press'},{id:3,name:'Tricep pushdown'},{id:4,name:'Chest fly'}]},{id:2,name:'Pull day',type:'lifting',exercises:[{id:5,name:'Deadlift'},{id:6,name:'Pull-ups'},{id:7,name:'Barbell row'},{id:8,name:'Bicep curl'}]},{id:3,name:'Leg day',type:'lifting',exercises:[{id:9,name:'Squat'},{id:10,name:'Leg press'},{id:11,name:'Lunges'}]},{id:4,name:'Run',type:'cardio',exercises:[{id:12,name:'Run',cardio:true}]}];
let rbWorkouts=[],rbBodyweight=[],rbNextId=500,rbView='home',rbActiveWorkout=null,rbDetailId=null,rbAddingWeight=false;
function getRBPRs(){const prs={};rbWorkouts.forEach(w=>w.exercises.forEach(ex=>{if(ex.cardio){if(!prs[ex.name])prs[ex.name]={cardio:true,dist:ex.distance||0,time:ex.timeMin||0};else if((ex.distance||0)>prs[ex.name].dist){prs[ex.name].dist=ex.distance;prs[ex.name].time=ex.timeMin;}}else{ex.sets?.forEach(s=>{if(s.weight>0||s.reps>0){if(!prs[ex.name])prs[ex.name]={cardio:false,weight:s.weight,reps:s.reps};else if(s.weight>prs[ex.name].weight||(s.weight===prs[ex.name].weight&&s.reps>prs[ex.name].reps)){prs[ex.name].weight=s.weight;prs[ex.name].reps=s.reps;}}});}}););return prs;}
function rbSubNav(active){return `<div style="display:flex;border-bottom:0.5px solid var(--color-border-tertiary);margin-bottom:1.25rem;"><button class="rb-tab-btn ${active==='home'?'active':''}" onclick="rbView='home';renderRB()">Home</button><button class="rb-tab-btn ${active==='history'?'active':''}" onclick="rbView='history';renderRB()">History</button><button class="rb-tab-btn ${active==='progress'?'active':''}" onclick="rbView='progress';renderRB()">Progress</button></div>`;}
function renderRB(){if(rbView==='log')renderRBLog();else if(rbView==='history')renderRBHistory();else if(rbView==='progress')renderRBProgress();else if(rbView==='detail')renderRBDetail();else renderRBHome();}
function renderRBHome(){const now=new Date();const wkStart=new Date(now);wkStart.setDate(now.getDate()-now.getDay());wkStart.setHours(0,0,0,0);const thisWeek=rbWorkouts.filter(w=>new Date(w.date+'T00:00:00')>=wkStart).length;const last=rbWorkouts.length?rbWorkouts[rbWorkouts.length-1]:null;const lastD=last?new Date(last.date+'T00:00:00'):null;const since=lastD?Math.round((now-lastD)/86400000):null;let html=`<p class="widget-title">RepBook</p>${rbSubNav('home')}`;if(rbActiveWorkout){html+=`<div style="background:var(--color-background-info);border:0.5px solid var(--color-border-info);border-radius:var(--border-radius-lg);padding:0.875rem 1rem;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;"><div><div style="font-size:13px;font-weight:500;color:var(--color-text-info);">Workout in progress</div><div style="font-size:12px;color:var(--color-text-info);opacity:0.8;">${rbActiveWorkout.templateName}</div></div><button class="save-btn" onclick="rbView='log';renderRB()" style="font-size:12px;padding:5px 14px;">Resume</button></div>`;}html+=`<div class="rb-metrics"><div class="metric"><div class="metric-label">Total</div><div class="metric-value">${rbWorkouts.length}</div></div><div class="metric"><div class="metric-label">This week</div><div class="metric-value">${thisWeek}</div></div><div class="metric"><div class="metric-label">Last workout</div><div class="metric-value" style="font-size:14px;">${since===null?'—':since===0?'Today':since===1?'Yesterday':since+'d ago'}</div></div></div>`;if(!rbActiveWorkout){html+=`<div class="card" style="margin-bottom:1rem;"><p class="section-label">Start workout</p><div style="display:flex;gap:8px;flex-wrap:wrap;">${rbTemplates.map(t=>`<button class="type-chip" onclick="startRBWorkout(${t.id})" style="margin-bottom:4px;"><i class="ti ti-${t.type==='cardio'?'run':'barbell'}" style="font-size:13px;margin-right:4px;"></i>${t.name}</button>`).join('')}</div></div>`;}html+=`<p class="section-label">Recent workouts</p>`;const recent=[...rbWorkouts].reverse().slice(0,3);if(!recent.length){html+=`<div style="text-align:center;padding:1.5rem;font-size:13px;color:var(--color-text-secondary);">No workouts logged yet — start one above!</div>`;}else recent.forEach(w=>{html+=`<div class="pk-trip-card" onclick="rbDetailId=${w.id};rbView='detail';renderRB()"><div style="display:flex;align-items:flex-start;justify-content:space-between;"><div><div style="font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:3px;">${w.templateName}</div><div style="font-size:12px;color:var(--color-text-secondary);">${fmtDate(w.date)} · ${w.duration} min</div><div style="font-size:12px;color:var(--color-text-secondary);margin-top:2px;">${w.exercises.map(e=>e.name).join(', ')}</div></div><i class="ti ti-chevron-right" style="font-size:15px;color:var(--color-text-secondary);"></i></div></div>`;});document.getElementById('rb-content').innerHTML=html;}
function startRBWorkout(tid){const tmpl=rbTemplates.find(t=>t.id===tid);if(!tmpl)return;rbActiveWorkout={id:++rbNextId,templateId:tid,templateName:tmpl.name,type:tmpl.type,startTime:Date.now(),exercises:tmpl.exercises.map(ex=>({exerciseId:ex.id,name:ex.name,cardio:ex.cardio||false,sets:[],distance:0,timeMin:0}))};rbView='log';renderRB();}
function renderRBLog(){if(!rbActiveWorkout){rbView='home';renderRBHome();return;}const elapsed=Math.max(0,Math.round((Date.now()-rbActiveWorkout.startTime)/60000));let html=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;"><div style="display:flex;align-items:center;gap:10px;"><button class="icon-btn" onclick="rbView='home';renderRB()" style="border:0.5px solid var(--color-border-tertiary);"><i class="ti ti-arrow-left" style="font-size:15px;"></i></button><div><div style="font-size:18px;font-weight:500;color:var(--color-text-primary);">${rbActiveWorkout.templateName}</div><div style="font-size:12px;color:var(--color-text-secondary);">${elapsed} min elapsed</div></div></div><button class="save-btn" onclick="finishRBWorkout()">Finish</button></div>`;rbActiveWorkout.exercises.forEach((ex,ei)=>{const prevSets=rbWorkouts.flatMap(w=>w.exercises).filter(e=>e.exerciseId===ex.exerciseId).flatMap(e=>e.sets||[]);const prevBest=prevSets.length?Math.max(...prevSets.map(s=>s.weight)):0;html+=`<div class="card" style="margin-bottom:8px;"><div style="font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:6px;">${ex.name}${!ex.cardio&&prevBest>0?`<span style="font-size:12px;font-weight:400;color:var(--color-text-secondary);margin-left:8px;">best: ${prevBest} lbs</span>`:''}</div>`;if(ex.cardio){html+=`<div style="display:flex;gap:8px;"><div style="flex:1;"><label class="form-label">Distance (mi)</label><input type="number" value="${ex.distance||''}" placeholder="0.0" step="0.1" min="0" class="base-input" style="width:100%;" oninput="rbActiveWorkout.exercises[${ei}].distance=parseFloat(this.value)||0"></div><div style="flex:1;"><label class="form-label">Time (min)</label><input type="number" value="${ex.timeMin||''}" placeholder="0" min="0" class="base-input" style="width:100%;" oninput="rbActiveWorkout.exercises[${ei}].timeMin=parseInt(this.value)||0"></div></div>`;}else{if(ex.sets.length){html+=`<div style="display:flex;gap:8px;font-size:11px;color:var(--color-text-secondary);font-weight:500;padding-bottom:4px;"><span style="width:28px;">#</span><span style="flex:1;">Weight (lbs)</span><span style="flex:1;">Reps</span><span style="width:26px;"></span></div>`;ex.sets.forEach((s,si)=>{html+=`<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;"><span style="width:28px;font-size:12px;color:var(--color-text-secondary);">${si+1}</span><input type="number" value="${s.weight||''}" placeholder="lbs" min="0" class="base-input" style="flex:1;" oninput="rbActiveWorkout.exercises[${ei}].sets[${si}].weight=parseFloat(this.value)||0"><input type="number" value="${s.reps||''}" placeholder="reps" min="0" class="base-input" style="flex:1;" oninput="rbActiveWorkout.exercises[${ei}].sets[${si}].reps=parseInt(this.value)||0"><button class="icon-btn" onclick="rbActiveWorkout.exercises[${ei}].sets.splice(${si},1);renderRBLog()"><i class="ti ti-x" style="font-size:12px;"></i></button></div>`;});}html+=`<button class="add-btn" onclick="rbActiveWorkout.exercises[${ei}].sets.push({weight:0,reps:0});renderRBLog()" style="margin-top:2px;"><i class="ti ti-plus" style="font-size:12px;margin-right:4px;"></i>Add set</button>`;}html+=`</div>`;});document.getElementById('rb-content').innerHTML=html;}
function finishRBWorkout(){if(!rbActiveWorkout)return;const duration=Math.max(1,Math.round((Date.now()-rbActiveWorkout.startTime)/60000));const exercises=rbActiveWorkout.exercises.map(ex=>ex.cardio?{exerciseId:ex.exerciseId,name:ex.name,cardio:true,distance:ex.distance||0,timeMin:ex.timeMin||0}:{exerciseId:ex.exerciseId,name:ex.name,sets:(ex.sets||[]).filter(s=>s.weight>0||s.reps>0)}).filter(ex=>ex.cardio?ex.distance>0:ex.sets.length>0);const today=new Date().toISOString().split('T')[0];rbWorkouts.push({id:rbNextId,templateId:rbActiveWorkout.templateId,templateName:rbActiveWorkout.templateName,date:today,duration,exercises});rbActiveWorkout=null;rbView='home';renderRB();}
function renderRBHistory(){let html=`<p class="widget-title">RepBook</p>${rbSubNav('history')}`;if(!rbWorkouts.length){html+=`<div class="coming-soon"><i class="ti ti-list"></i><p style="font-weight:500;color:var(--color-text-primary);">No workouts yet</p><p>Log your first workout from the home tab.</p></div>`;}else{[...rbWorkouts].reverse().forEach(w=>{html+=`<div class="pk-trip-card" onclick="rbDetailId=${w.id};rbView='detail';renderRB()"><div style="display:flex;align-items:flex-start;justify-content:space-between;"><div><div style="font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:3px;">${w.templateName}</div><div style="font-size:12px;color:var(--color-text-secondary);">${fmtDate(w.date)} · ${w.duration} min · ${w.exercises.length} exercise${w.exercises.length!==1?'s':''}</div><div style="font-size:12px;color:var(--color-text-secondary);margin-top:2px;">${w.exercises.map(e=>e.name).join(', ')}</div></div><div style="display:flex;align-items:center;gap:6px;"><button class="icon-btn" onclick="event.stopPropagation();if(confirm('Delete this workout?')){rbWorkouts=rbWorkouts.filter(x=>x.id!==${w.id});renderRBHistory();}"><i class="ti ti-trash" style="font-size:14px;"></i></button><i class="ti ti-chevron-right" style="font-size:15px;color:var(--color-text-secondary);"></i></div></div></div>`;});}document.getElementById('rb-content').innerHTML=html;}
function renderRBDetail(){const w=rbWorkouts.find(w=>w.id===rbDetailId);if(!w){rbView='history';renderRBHistory();return;}let html=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:1.5rem;"><button class="icon-btn" onclick="rbView='history';renderRB()" style="border:0.5px solid var(--color-border-tertiary);"><i class="ti ti-arrow-left" style="font-size:15px;"></i></button><div><div style="font-size:18px;font-weight:500;color:var(--color-text-primary);">${w.templateName}</div><div style="font-size:12px;color:var(--color-text-secondary);">${fmtDate(w.date)} · ${w.duration} min</div></div></div>`;w.exercises.forEach(ex=>{html+=`<div class="card" style="margin-bottom:8px;"><div style="font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:8px;">${ex.name}</div>`;if(ex.cardio){html+=`<div style="font-size:13px;color:var(--color-text-secondary);">${ex.distance} mi · ${ex.timeMin} min${ex.distance&&ex.timeMin?` · ${(ex.timeMin/ex.distance).toFixed(1)} min/mi`:''}`;html+=`</div>`;}else{html+=`<table class="rb-table"><thead><tr><th>Set</th><th style="text-align:right;">Weight</th><th style="text-align:right;">Reps</th></tr></thead><tbody>`;ex.sets.forEach((s,i)=>{html+=`<tr><td>${i+1}</td><td style="text-align:right;">${s.weight>0?s.weight+' lbs':'BW'}</td><td style="text-align:right;">${s.reps}</td></tr>`;});html+=`</tbody></table>`;}html+=`</div>`;});document.getElementById('rb-content').innerHTML=html;}
function renderRBProgress(){const prs=getRBPRs();let html=`<p class="widget-title">RepBook</p>${rbSubNav('progress')}`;html+=`<div class="card" style="margin-bottom:1rem;"><p class="section-label">Personal records</p>`;if(!Object.keys(prs).length){html+=`<div style="text-align:center;padding:1rem;font-size:13px;color:var(--color-text-secondary);">Log workouts to see your PRs</div>`;}else{html+=`<table class="rb-table"><thead><tr><th>Exercise</th><th style="text-align:right;">Best</th></tr></thead><tbody>`;Object.entries(prs).forEach(([name,pr])=>{const val=pr.cardio?`${pr.dist} mi`:`${pr.weight} lbs × ${pr.reps}`;html+=`<tr><td>${name}</td><td style="text-align:right;font-weight:500;">${val}</td></tr>`;});html+=`</tbody></table>`;}html+=`</div>`;html+=`<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem;"><p class="section-label" style="margin-bottom:0;">Bodyweight</p><button class="save-btn" style="font-size:12px;padding:4px 12px;" onclick="rbAddingWeight=!rbAddingWeight;renderRBProgress()">Log weight</button></div>`;if(rbAddingWeight){const today=new Date().toISOString().split('T')[0];html+=`<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;"><input type="date" id="rb-bw-date" value="${today}" class="base-input" style="flex:1;"><input type="number" id="rb-bw-val" placeholder="lbs" min="0" step="0.5" class="base-input" style="width:90px;"><button class="save-btn" style="font-size:12px;padding:5px 12px;" onclick="saveRBBodyweight()">Save</button><button class="cancel-btn" style="font-size:12px;padding:5px 10px;" onclick="rbAddingWeight=false;renderRBProgress()">✕</button></div>`;}if(rbBodyweight.length){const sorted=[...rbBodyweight].sort((a,b)=>new Date(a.date)-new Date(b.date));const weights=sorted.map(e=>e.weight);const mn=Math.min(...weights),mx=Math.max(...weights),range=mx-mn||1;const W=280,H=52;const pts=sorted.map((e,i)=>{const x=sorted.length===1?W/2:i/(sorted.length-1)*(W-20)+10;const y=H-((e.weight-mn)/range)*(H-14)-7;return `${x.toFixed(1)},${y.toFixed(1)}`;}).join(' ');html+=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;margin-bottom:8px;"><polyline points="${pts}" style="fill:none;stroke:var(--color-text-secondary);stroke-width:1.5;stroke-linejoin:round;"/>${sorted.map((e,i)=>{const x=sorted.length===1?W/2:i/(sorted.length-1)*(W-20)+10;const y=H-((e.weight-mn)/range)*(H-14)-7;return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" style="fill:var(--color-text-primary);"/>`;}).join('')}</svg>`;[...sorted].reverse().forEach(e=>{html+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:0.5px solid var(--color-border-tertiary);"><span style="font-size:13px;color:var(--color-text-secondary);">${fmtDate(e.date)}</span><div style="display:flex;align-items:center;gap:8px;"><span style="font-size:13px;font-weight:500;">${e.weight} lbs</span><button class="icon-btn" onclick="rbBodyweight=rbBodyweight.filter(b=>b.id!==${e.id});renderRBProgress()"><i class="ti ti-x" style="font-size:12px;"></i></button></div></div>`;});}else{html+=`<div style="text-align:center;padding:1rem;font-size:13px;color:var(--color-text-secondary);">No entries yet</div>`;}html+=`</div>`;document.getElementById('rb-content').innerHTML=html;if(rbAddingWeight)setTimeout(()=>document.getElementById('rb-bw-val')?.focus(),20);}
function saveRBBodyweight(){const date=document.getElementById('rb-bw-date')?.value;const weight=parseFloat(document.getElementById('rb-bw-val')?.value);if(!weight||!date){alert('Please enter a date and weight.');return;}rbBodyweight.push({id:++rbNextId,date,weight});rbAddingWeight=false;renderRBProgress();}
renderRB();
</script>
